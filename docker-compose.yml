version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=wsgi:app
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:////app/instance/database.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app  # ✅ This ensures /app is properly mapped
      - backend-data:/app/instance


  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app  # Mount frontend source code
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  # ✅ Force polling to detect changes

volumes:
  backend-data:
